<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#111218"/><stop offset="1" stop-color="#18131A"/></linearGradient>
    <filter id="shadow" x="250" y="120" width="1100" height="800" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".62"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1370" cy="110" r="310" fill="#E0228F" fill-opacity=".11"/>
  <circle cx="120" cy="930" r="240" fill="#E0228F" fill-opacity=".07"/>
  <text x="100" y="112" fill="#F7F5F7" font-family="sans-serif" font-size="46" font-weight="700">aismell quick clean</text>
  <text x="100" y="164" fill="#B7B1B7" font-family="sans-serif" font-size="25">rewrite a short draft, compare the proposal, then decide</text>
  <g filter="url(#shadow)">
    <rect x="300" y="220" width="1000" height="610" rx="16" fill="#1A181C" stroke="#4E4750" stroke-width="2"/>
    <text x="350" y="292" fill="#F7F5F7" font-family="sans-serif" font-size="31" font-weight="700">aismell quick clean</text>
    <text x="350" y="331" fill="#B7B1B7" font-family="sans-serif" font-size="19">aismell proposes a direct version. You decide whether to use it.</text>
    <text x="350" y="354" fill="#8E878E" font-family="sans-serif" font-size="16">Sent to aismell's rewrite service · not stored.</text>
    <text x="1250" y="295" fill="#E5DFE5" font-family="sans-serif" font-size="30">×</text>
    <rect x="350" y="374" width="900" height="1" fill="#4E4750"/>
    <text x="350" y="414" fill="#DED8DE" font-family="sans-serif" font-size="21">Direct version ready. Review it before copying.</text>
    <text x="350" y="440" fill="#A8A1A8" font-family="sans-serif" font-size="16">1 proposed change · the original stays editable.</text>
    <rect x="350" y="458" width="432" height="238" rx="11" fill="#242126" stroke="#4E4750"/>
    <text x="377" y="496" fill="#A8A1A8" font-family="sans-serif" font-size="16" font-weight="700">YOUR TEXT</text>
    <text x="377" y="544" fill="#DFD9DF" font-family="sans-serif" font-size="21">It is important to note that</text>
    <text x="377" y="576" fill="#DFD9DF" font-family="sans-serif" font-size="21">the file is ready. In conclusion,</text>
    <text x="377" y="608" fill="#DFD9DF" font-family="sans-serif" font-size="21">thanks.</text>
    <rect x="818" y="458" width="432" height="238" rx="11" fill="#35152C" stroke="#E0228F" stroke-width="2"/>
    <text x="845" y="496" fill="#FFD1EB" font-family="sans-serif" font-size="16" font-weight="700">PROPOSED VERSION</text>
    <text x="845" y="544" fill="#FFF6FC" font-family="sans-serif" font-size="21">The file is ready. Thanks.</text>
    <text x="845" y="592" fill="#E9CFE0" font-family="sans-serif" font-size="16">Removed empty framing and conclusion.</text>
    <rect x="350" y="735" width="228" height="54" rx="10" fill="#252227" stroke="#4E4750"/>
    <text x="367" y="769" fill="#DED8DE" font-family="sans-serif" font-size="15">rewrite clipboard</text>
    <rect x="594" y="735" width="174" height="54" rx="10" fill="#252227" stroke="#4E4750"/>
    <text x="615" y="769" fill="#DED8DE" font-family="sans-serif" font-size="16">rewrite text</text>
