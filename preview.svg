<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#111218"/><stop offset="1" stop-color="#18131A"/></linearGradient>
    <filter id="shadow" x="250" y="120" width="1100" height="800" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity=".62"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1370" cy="110" r="310" fill="#E0228F" fill-opacity=".11"/>
  <circle cx="120" cy="930" r="240" fill="#E0228F" fill-opacity=".07"/>
  <text x="100" y="112" fill="#F7F5F7" font-family="sans-serif" font-size="46" font-weight="700">aismell quick clean</text>
  <text x="100" y="164" fill="#B7B1B7" font-family="sans-serif" font-size="25">review real aismell signals, edit in your own words, then copy</text>
  <g filter="url(#shadow)">
    <rect x="300" y="220" width="1000" height="610" rx="16" fill="#1A181C" stroke="#4E4750" stroke-width="2"/>
    <text x="350" y="292" fill="#F7F5F7" font-family="sans-serif" font-size="31" font-weight="700">aismell quick clean</text>
    <text x="350" y="331" fill="#B7B1B7" font-family="sans-serif" font-size="19">aismell shows the real signal. You rewrite; it never invents the wording.</text>
    <text x="350" y="354" fill="#8E878E" font-family="sans-serif" font-size="16">Processed locally · never sent or saved to disk.</text>
    <text x="1250" y="295" fill="#E5DFE5" font-family="sans-serif" font-size="30">×</text>
    <rect x="350" y="374" width="900" height="1" fill="#4E4750"/>
    <text x="350" y="414" fill="#DED8DE" font-family="sans-serif" font-size="21">aismell found 3 signals to review.</text>
    <text x="350" y="440" fill="#A8A1A8" font-family="sans-serif" font-size="16">Signal index: 58/100 · edit in your words, then review again.</text>
    <rect x="350" y="458" width="432" height="238" rx="11" fill="#242126" stroke="#4E4750"/>
    <text x="377" y="496" fill="#A8A1A8" font-family="sans-serif" font-size="16" font-weight="700">YOUR TEXT</text>
    <text x="377" y="544" fill="#DFD9DF" font-family="sans-serif" font-size="21">It is important to note that</text>
    <text x="377" y="576" fill="#DFD9DF" font-family="sans-serif" font-size="21">the file is ready.</text>
    <text x="377" y="608" fill="#DFD9DF" font-family="sans-serif" font-size="21">not just a tool, but Y.</text>
    <rect x="818" y="458" width="432" height="238" rx="11" fill="#35152C" stroke="#E0228F" stroke-width="2"/>
    <text x="845" y="496" fill="#FFD1EB" font-family="sans-serif" font-size="16" font-weight="700">AISMELL SIGNALS</text>
    <text x="845" y="544" fill="#FFF6FC" font-family="sans-serif" font-size="20">“It is important to note”</text>
    <text x="845" y="576" fill="#E9CFE0" font-family="sans-serif" font-size="16">Meta-announcement</text>
    <text x="845" y="608" fill="#E9CFE0" font-family="sans-serif" font-size="16">→ Delete and state the point.</text>
    <text x="845" y="646" fill="#FFF6FC" font-family="sans-serif" font-size="18">“not just X, but Y”</text>
    <rect x="350" y="735" width="184" height="54" rx="10" fill="#252227" stroke="#4E4750"/>
    <text x="366" y="769" fill="#DED8DE" font-family="sans-serif" font-size="15">review clipboard</text>
    <rect x="548" y="735" width="174" height="54" rx="10" fill="#252227" stroke="#4E4750"/>
    <text x="573" y="769" fill="#DED8DE" font-family="sans-serif" font-size="16">review text</text>
    <rect x="1007" y="735" width="243" height="54" rx="10" fill="#E0228F"/>
    <text x="1042" y="769" fill="#1B0B16" font-family="sans-serif" font-size="16" font-weight="700">copy edited text</text>
  </g>
  <rect x="100" y="890" width="265" height="1" fill="#E0228F"/>
  <text x="100" y="940" fill="#C5BFC5" font-family="sans-serif" font-size="22">super + shift + s · local text · English and Spanish</text>
</svg>
